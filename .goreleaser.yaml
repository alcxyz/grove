version: 2

project_name: grove

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/grove
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: grove
    name_template: "grove_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - src: cmd/grove/config.example.yaml
        strip_parent: true

checksum:
  name_template: "grove_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: alcxyz
    name: grove
  draft: false
  prerelease: auto

homebrew_casks:
  - name: grove
    repository:
      owner: alcxyz
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/alcxyz/grove
    description: Terminal UI for monitoring git forge repositories
    license: MIT
    hooks:
      post:
        # The binaries are not signed or notarized.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/grove"]
          end

aurs:
  - name: grove-tui-bin
    homepage: https://github.com/alcxyz/grove
    description: Terminal UI for monitoring git forge repositories
    maintainers:
      - alcxyz <alcxyz@users.noreply.github.com>
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    # Only trust the pinned AUR host keys the release job writes to known_hosts.
    git_ssh_command: "ssh -i {{ .KeyPath }} -o StrictHostKeyChecking=yes -F /dev/null"
    git_url: ssh://aur@aur.archlinux.org/grove-tui-bin.git
    provides:
      - grove
    conflicts:
      - grove
    package: |-
      install -Dm755 "./grove" "${pkgdir}/usr/bin/grove"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/grove/README.md"
      install -Dm644 "./config.example.yaml" "${pkgdir}/usr/share/doc/grove/config.example.yaml"
