version: 2

project_name: grove

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: grove
    name_template: "grove_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - config.example.yaml

checksum:
  name_template: "grove_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: alcxyz
    name: grove
  draft: false
  prerelease: auto

homebrew:
  - name: grove
    repository:
      owner: alcxyz
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/alcxyz/grove
    description: Terminal UI for monitoring GitHub repositories
    license: MIT
    install: |
      bin.install "grove"

aurs:
  - name: grove-bin
    # Requires AUR_KEY secret — SSH private key registered on aur.archlinux.org
    homepage: https://github.com/alcxyz/grove
    description: Terminal UI for monitoring GitHub repositories
    maintainers:
      - alcxyz <alcxyz@users.noreply.github.com>
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/grove-bin.git
    provides:
      - grove
    conflicts:
      - grove
    depends:
      - glibc
    package: |-
      install -Dm755 "./grove" "${pkgdir}/usr/bin/grove"
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/grove/README.md"
      install -Dm644 "./config.example.yaml" "${pkgdir}/usr/share/doc/grove/config.example.yaml"
