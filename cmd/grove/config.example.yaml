# grove configuration
# On first run this file is written to $XDG_CONFIG_HOME/grove/config.yaml
# (default: ~/.config/grove/config.yaml).

# Named profiles — each has its own default forge owner (org or username),
# one or more repo directories, prefix filters, and groups.
# Switch between profiles with < / > in the dashboard.
profiles:
  # Personal profile: owner = your default forge username enables PR/branch tracking.
  # prefixes: [] matches ALL repos found under base_paths.
  # Groups can use match_path to group repos by their directory location.
  - name: Personal
    owner: my-github-username
    base_paths:
      - ~/dev/git/personal
      - ~/projects
      - ~/nix
    prefixes: []   # empty = no filtering, all local repos are shown
    # Optional split-remote defaults:
    # code/browse uses the profile's top-level owner/forge fields.
    # social covers PRs + issues. ci covers workflow runs / pipelines.
    # social:
    #   owner: my-github-username
    #   forge: github
    #   auth_mode: token # default; use "gh" to reuse gh auth login
    # ci:
    #   owner: my-github-username
    #   forge: github
    #   auth_mode: token
    #
    # Per-repo overrides let one repo keep GitHub PRs/issues/CI while the
    # code hosting has moved to Forgejo:
    # repos:
    #   - name: annaetattoo              # local directory name
    #     code:
    #       owner: my-forgejo-user
    #       repo: annaetattoo.github.io  # optional remote repo name
    #       forge: forgejo
    #       instance_url: https://git.example.com
    #       token_file: ~/.config/forgejo/token
    #       clone_proto: ssh
    #       ssh_host: ssh-git.example.com
    #     social:
    #       owner: my-github-username
    #       repo: annaetattoo.github.io
    #       forge: github
    #     ci:
    #       owner: my-github-username
    #       repo: annaetattoo.github.io
    #       forge: github
    groups:
      - name: nix
        match_path: ~/nix              # all repos under ~/nix
      - name: pages
        match: github.io              # repos with "github.io" in the name

  # Work profile: scoped to an org with prefix filtering and group routing.
  # Groups control both the dashboard grouping AND the clone destination
  # (base_path on a group overrides the profile base_paths for "grove clone").
  # match: matches repo names (prefix/substring).
  # match_path: matches repo filesystem path (prefix). Either can trigger a match.
  - name: Work
    owner: my-org
    # auth_mode: gh # GitHub-only: useful when org policy blocks PATs
    base_paths:
      - ~/dev/git/my-org
    prefixes:
      - service-
      - platform-
      - infra-
    groups:
      - name: Services
        match: service-
        base_path: ~/dev/git/my-org/services   # clone goes here
      - name: Platform
        match: platform-
        base_path: ~/dev/git/my-org/platform   # clone goes here
      - name: Infra
        match: infra-
        # no base_path → falls back to base_paths[0]

# How often (in seconds) the dashboard auto-refreshes in the background.
refresh_secs: 300

# Seconds of idle time before the screensaver activates (0 = disabled).
screensaver_secs: 300

# ── Legacy single-profile format (still supported) ───────────────────────────
# If you prefer the flat format (no "profiles:" key), grove synthesises a
# single "default" profile from these fields automatically.
#
# base_path: ~/dev/git/my-org
# org: my-org
# prefixes:
#   - service-
#   - platform-
