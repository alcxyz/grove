# grove configuration
# On first run this file is written to $XDG_CONFIG_HOME/grove/config.yaml
# (default: ~/.config/grove/config.yaml).

# Absolute or ~ path to the directory that contains your local repo checkouts.
base_path: ~/dev/git/my-org

# GitHub organisation (used when calling the gh CLI for PRs and branches).
org: my-org

# Only directories whose names start with one of these prefixes are scanned.
prefixes:
  - service-
  - platform-

# How often (in seconds) the dashboard auto-refreshes in the background.
refresh_secs: 300

# Seconds of idle time before the screensaver activates (0 = disabled).
screensaver_secs: 300

# Named groups control how repos are grouped and in what order they appear
# across all tabs.  The first matching group wins; repos that match no group
# fall into an implicit "other" group at the bottom.
groups:
  - name: Infrastructure
    match: infra-
  - name: Services
    match: service-
  - name: Platform
    match: platform-
